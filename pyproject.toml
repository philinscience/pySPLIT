[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysplit-st"
version = "0.3.0"
description = "Unofficial Python port of the SPLIT R package: Spatial Purification of Layered Intracellular Transcripts (Xenium)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Philipp Putze", email = "putze1@me.com" }]
keywords = ["spatial transcriptomics", "Xenium", "deconvolution", "RCTD", "contamination"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "anndata>=0.8",
  "scikit-learn>=1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
rctdpy = ["pyarrow>=8", "h5py>=3"]
test = ["pytest>=7"]
all = ["matplotlib>=3.5", "pyarrow>=8", "h5py>=3", "pytest>=7"]

[project.urls]
"Original R package (cite this)" = "https://github.com/bdsc-tds/SPLIT"
"Original paper" = "https://doi.org/10.1038/s41592-026-03089-8"
Tutorial = "https://github.com/philinscience/pySPLIT/blob/main/docs/tutorial.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
